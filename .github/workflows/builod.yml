          sealed interface Parsed {
              val value: String
              data class Url(val url: String) : Parsed {
                  override val value: String get() = url
              }
              data class Special(val content: String, val scheme: String) : Parsed {
                  override val value: String get() = content
              }
              data class Text(val text: String) : Parsed {
                  override val value: String get() = text
              }
          }

          object QrUrlParser{
              @SuppressLint("RegExp")
              private val schemeRegex = Regex("^([a-zA-Z][a-zA-Z0-9+.-]*):")
              fun parse(raw: String): Parsed {
                  val trimmed = raw.trim()
                  return when {
                      trimmed.startsWith("http://", ignoreCase = true) ||
                      trimmed.startsWith("https://", ignoreCase = true) -> Parsed.Url(trimmed)
schemeR
