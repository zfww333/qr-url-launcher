name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 生成项目源码
        run: |
          mkdir -p app/src/main/java/com/example/qrurlauncher app/src/main/res/values
          printf '%s' '' | base64 -d > settings.gradle.kts
          printf '%s' 'Ly8g5qC557qn5p6E5bu66ISa5pys77ya5LuF5aOw5piO5o+S5Lu254mI5pys77yM5LiN5YGa5YW35L2T5L6d6LWWCnBsdWdpbnMgewogICAgaWQoImNvbS5hbmRyb2lkLmFwcGxpY2F0aW9uIikgdmVyc2lvbiAiOC41LjIiIGFwcGx5IGZhbHNlCiAgICBpZCgib3JnLmpldGJyYWlucy5rb3RsaW4uYW5kcm9pZCIpIHZlcnNpb24gIjEuOS4yNCIgYXBwbHkgZmFsc2UKfQo=' | base64 -d > build.gradle.kts
          printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg==' | base64 -d > gradle.properties
          printf '%s' '' | base64 -d > app/build.gradle.kts
          printf '%s' 'IyDmnKzpobnnm64gcmVsZWFzZSDmnoTlu7rmnKrlvIDlkK/mt7fmt4bvvIzmraTlpITnlZnnqbrljbPlj6/jgIIKIyDoi6Xml6XlkI7lvIDlkK8gbWluaWZ577yM5Y+v5Zyo5q2k6KGl5YWFIFpYaW5nIC8gQ29tcG9zZSDnm7jlhbMga2VlcCDop4TliJnjgIIK' | base64 -d > app/proguard-rules.pro
          printf '%s' '' | base64 -d > app/src/main/AndroidManifest.xml
          printf '%s' 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPuS6jOe7tOeggee9keWdgOWQr+WKqOWZqDwvc3RyaW5nPgo8L3Jlc291cmNlcz4K' | base64 -d > app/src/main/res/values/strings.xml
          printf '%s' '' | base64 -d > app/src/main/res/values/themes.xml
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/AppInfo.kt
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/QrUrlParser.kt
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/AppResolver.kt
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/CameraPreview.kt
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/Theme.kt
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/AppPickerSheet.kt
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/QrScannerApp.kt
          printf '%s' '' | base64 -d > app/src/main/java/com/example/qrurlauncher/MainActivity.kt
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 确保 Android SDK 组件
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: 安装 Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: qr-url-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
